{% if user.is_authenticated %}
<form method="post" action="{% url 'main:toggle_star' achievement.id %}" class="star-form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    {% if achievement.id in starred_ids %}
    <button type="submit" class="button button-star is-starred" aria-pressed="true" title="Batalkan star">
        <span aria-hidden="true">★</span> Unstar
        <span class="star-count">{{ achievement.star_count }}</span>
    </button>
    {% else %}
    <button type="submit" class="button button-star" aria-pressed="false" title="Beri star">
        <span aria-hidden="true">☆</span> Star
        <span class="star-count">{{ achievement.star_count }}</span>
    </button>
    {% endif %}
</form>
{% else %}
<a href="{% url 'main:login' %}?next={{ request.get_full_path|urlencode }}"
   class="button button-star" title="Login untuk memberi star">
    <span aria-hidden="true">☆</span> Login untuk Star
    <span class="star-count">{{ achievement.star_count }}</span>
</a>

{% endif %}
